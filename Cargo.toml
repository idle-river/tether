[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["tokio-rustls"] }
futures-util = "0.3.34"

# Local crates
tether-core = { path = "./crates/core" }
server = { path = "./crates/server" }
cli = { path = "./crates/cli" }
